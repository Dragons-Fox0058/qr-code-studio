name: Documentation checks

on:
  push:
    paths:
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "CHANGELOG.md"
      - "HELP.md"
      - "INSTALL.md"
      - "LICENSE_ADDITIONAL.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/docs-lint.yml"
  pull_request:
    paths:
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "CHANGELOG.md"
      - "HELP.md"
      - "INSTALL.md"
      - "LICENSE_ADDITIONAL.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/docs-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    name: Lint repository documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint maintained documentation
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            SECURITY.md
            SUPPORT.md
            CHANGELOG.md
            HELP.md
            INSTALL.md
            LICENSE_ADDITIONAL.md
            docs/*.md
            .github/PULL_REQUEST_TEMPLATE.md
