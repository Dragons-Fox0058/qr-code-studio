name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues before submitting. Do not include passwords, tokens, private keys, or personal data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the problem.
      placeholder: Describe the issue.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App/repository version
      placeholder: e.g. v1.2.0
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include device and Android version if relevant.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add relevant screenshots or logs. Remove personal or sensitive information first.
